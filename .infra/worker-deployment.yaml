apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-functions
  labels:
    app: worker-functions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-functions
  template:
    metadata:
      name: worker-functions
      labels:
        app: worker-functions
    spec:
      containers:
        - name: worker-functions
          image: localhost:32000/projectcenturion-workerfunctions:latest
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: RabbitMq__Host
              value: "queue.internal"
      restartPolicy: Always
      